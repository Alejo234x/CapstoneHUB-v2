# Compose para desplegar CapstoneHUB en Dokploy (Docker Compose service).
#
# Las imágenes se publican en GHCR por .github/workflows/release.yml. Configura
# las variables en Dokploy > Environment y los dominios en la pestaña Domains
# (Dokploy agrega las etiquetas de Traefik y la red dokploy-network solo).
#
# No se define `container_name`: Dokploy lo desaconseja (rompe logs y métricas).
# Los puertos se exponen con `expose` y Dokploy los enruta vía Traefik.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - capstone

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Origen permitido por CORS para las subidas directas desde el navegador.
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ORIGINS}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    networks:
      - capstone

  # Crea el bucket una sola vez antes de que arranque el backend.
  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local "http://minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio...";
          sleep 2;
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready"
    networks:
      - capstone

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/iscoutb/capstonehub-backend:latest}
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      SWAGGER_ENABLED: "false"
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_NAME}
      AUTH_SECRET: ${AUTH_SECRET}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10485760}
      MAX_REPORT_FILE_SIZE_BYTES: ${MAX_REPORT_FILE_SIZE_BYTES:-104857600}
      S3_ENDPOINT: http://minio:9000
      # URL pública de MinIO (o de S3) que alcanza el navegador para las subidas.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      S3_UPLOAD_URL_TTL_SECONDS: ${S3_UPLOAD_URL_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "3001"
    networks:
      - capstone

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/iscoutb/capstonehub-frontend:latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - capstone

volumes:
  db_data:
  minio_data:

networks:
  capstone:
