# Compose para desplegar CapstoneHUB en Dokploy (Docker Compose service).
#
# Nota: se usa el servicio de base de datos de
# Dokploy. Para eso se define DATABASE_URL en
# Dokploy > Environment apuntando a su host interno, por ejemplo
# `postgresql://usuario:<contrasena>@<servicio-db>:5432/capstonehub`. El backend
# se une a `dokploy-network` para poder hacer reach.
#
# Las imágenes se publican en GHCR por .github/workflows/release.yml. Configura
# las variables en Dokploy > Environment y los dominios en la pestaña Domains
# (Dokploy agrega las etiquetas de Traefik al servicio con dominio).
#
# No se define `container_name`: Dokploy lo desaconseja (rompe logs y métricas).
# Los puertos se exponen con `expose` y Dokploy los enruta vía Traefik.

services:
  # Almacenamiento de objetos S3 (RustFS, sucesor de MinIO).
  # Solo se accede desde el backend por la red interna; las subidas y descargas
  # pasan por la API, así que no necesita dominio público ni CORS.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs_data:/data
    expose:
      - "9000" # S3 API
      - "9001" # Consola (opcional; exponer con un dominio de Dokploy)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - capstone

  backend:
    # Temporal: compilar en Dokploy hasta configurar los permisos de GHCR.
    # Para volver a bajar de GHCR, sustituye `build` por:
    #   image: ${BACKEND_IMAGE:-ghcr.io/iscoutb/capstonehub/capstonehub-backend:latest}
    build:
      context: ./hub-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: production
      SWAGGER_ENABLED: "false"
      # Cadena de conexión al servicio de base de datos de Dokploy (host interno).
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10485760}
      MAX_REPORT_FILE_SIZE_BYTES: ${MAX_REPORT_FILE_SIZE_BYTES:-104857600}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      rustfs:
        condition: service_started
    expose:
      - "3001"
    networks:
      - capstone
      # Necesaria para alcanzar el servicio de base de datos de Dokploy.
      - dokploy-network

  frontend:
    # Temporal: compilar en Dokploy hasta configurar los permisos de GHCR.
    # Para volver a bajar de GHCR, sustituye `build` por:
    #   image: ${FRONTEND_IMAGE:-ghcr.io/iscoutb/capstonehub/capstonehub-frontend:latest}
    build:
      context: ./hub-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - capstone

volumes:
  rustfs_data:

networks:
  capstone:
  dokploy-network:
    external: true
